services:
  - type: web
    name: darb-kpi-platform
    runtime: python
    rootDir: platform
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DARB_SECRET
        generateValue: true
